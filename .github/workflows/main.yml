name: Deploy to Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: vps-proxy
          region: ${{ secrets.GCP_REGION }}
          source: .
          flags: --allow-unauthenticated --timeout=3600 --concurrency=1000 --min-instances=0 --max-instances=3 --cpu-boost --session-affinity --port=8080
          env_vars: |
            VPS_HOST=${{ secrets.VPS_HOST || '217.60.6.102' }}
            SSH_WS_PORT=${{ secrets.SSH_WS_PORT || '80' }}
            V2RAY_PORT=${{ secrets.V2RAY_PORT || '8080' }}
            VLESS_PORT=${{ secrets.VLESS_PORT || '8081' }}
            VMESS_PORT=${{ secrets.VMESS_PORT || '8082' }}
            TROJAN_PORT=${{ secrets.TROJAN_PORT || '8083' }}
